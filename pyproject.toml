[project]
name = "netspeed"
version = "0.1.0"
description = "Замер скорости скачивания по HTTP: N последовательных запросов к одному URL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
netspeed = "netspeed.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Сообщения и комментарии на русском: кириллица — не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
